---

version: 2

updates:
  # Using dependabot for all GHA violates pinning policy
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Check for new versions weekly
      interval: weekly
    # Update all actions in a single PR
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - automation
      - gha-update
    # Only allow updates for actions maintained by GitHub
    allow:
      - dependency-name: "actions/*"
      - dependency-name: "github-actions/*"
    cooldown:
      default-days: 7

  # Automatically propose PRs for Python dependencies
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip-updates:
        patterns: ["*"]
    labels:
      - automation
      - pip-update
    commit-message:
      # Prefix all commit messages with "pip: "
      prefix: "pip"
    ignore:
      # Needs to be pinned due to passlib bug
      - dependency-name: "bcrypt"
        versions:
        - ">4.3.0"
